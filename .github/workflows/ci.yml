name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run every browser test, not only the smoke tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Reference saves are private and not in this repo, so the tests that need them skip here.
      - run: npm test
      - run: npm run build
      - name: Lite size budget (450 KB)
        run: npm run size
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke tests (Playwright, Chromium)
        if: ${{ !inputs.full_e2e }}
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/console-clean.spec.ts --workers=2 --reporter=list
      - name: All browser tests (Playwright, Chromium)
        if: ${{ inputs.full_e2e }}
        run: npx playwright test --workers=2 --reporter=list

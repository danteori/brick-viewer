name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Smoke test (Playwright, Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --workers=1 --reporter=list tests/e2e/parity.spec.ts -g interaction

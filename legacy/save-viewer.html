<style>
  :root { --bg:#2b2c30; --fg:#eee; --muted:#9a9ca3; }   /* dark gray in both themes */
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 system-ui, sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .dim { position:fixed; left:0; top:0; transform:translate(-50%,-50%); display:flex; align-items:baseline; gap:2px;
         padding:0 10px; border-radius:13px; background:#1d1e21; border:1px solid rgba(201,204,211,.35);
         color:#c9ccd3; font:600 17px/24px system-ui, sans-serif; cursor:text; white-space:nowrap; }
  .dim:hover { border-color:rgba(201,204,211,.8); }
  .dim.on { color:#e8590c; border-color:#e8590c; }
  .dim.lock { color:#fff; border-color:#fff; background:#2f3036;
              box-shadow:0 0 6px 1px rgba(255,255,255,.85), 0 0 18px 4px rgba(255,255,255,.35);
              text-shadow:0 0 6px rgba(255,255,255,.9); }
  .dim:focus-within { box-shadow:0 0 0 3px rgba(232,89,12,.35); }
  .dim input { width:1ch; padding:0; border:0; outline:0; background:none; color:inherit; font:inherit; text-align:center; font-variant-numeric:tabular-nums; }
  .dim input::selection { background:rgba(232,89,12,.45); color:#fff; }
  #ov, #dims { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; color:var(--fg); }
  #side { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top, 0px)); display:flex; flex-direction:column; gap:8px; align-items:stretch; }
  #mode { display:flex; padding:3px; gap:3px; border-radius:10px; background:rgba(29,30,33,.88); border:1px solid rgba(255,255,255,.12);
          box-shadow:0 6px 24px rgba(0,0,0,.35); }
  #mode button { flex:1; padding:6px 10px; border:0; border-radius:7px; background:none; color:#9a9ca3; cursor:pointer;
          font:600 12px/1.2 system-ui, sans-serif; }
  #mode button:hover { color:#eee; }
  #mode button[aria-pressed="true"] { background:#e8590c; color:#fff; }
  #mode button:focus-visible { outline:2px solid #fff; outline-offset:1px; }
  #mode button:disabled { opacity:.4; cursor:default; color:#9a9ca3; }   /* fixed-size rounds can't switch type */
  .dim.ro, .dim.ro:hover { cursor:default; border-color:rgba(201,204,211,.18); color:#9a9ca3; }   /* read-only size (rounds) */
  #menu .mrow.ro { cursor:default; } #menu .mrow.ro input { color:#9a9ca3; border-style:dashed; }
  #lightbox, #undobox { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 10px; border-radius:10px;
          background:rgba(29,30,33,.88); border:1px solid rgba(255,255,255,.12); box-shadow:0 6px 24px rgba(0,0,0,.35);
          font:600 12px/1.2 system-ui, sans-serif; color:#9a9ca3; }
  #lightbox select { min-width:0; flex:1; padding:4px 6px; border-radius:7px; border:1px solid rgba(255,255,255,.18); background:#2b2c30;
          color:#eee; font:600 12px/1.2 system-ui, sans-serif; }
  #lightbox select:focus-visible { outline:2px solid #fff; outline-offset:1px; }
  #undobox input { width:4.5em; padding:4px 6px; border-radius:7px; border:1px solid rgba(255,255,255,.18); background:#2b2c30;
          color:#eee; font:600 12px/1.2 system-ui, sans-serif; }
  #undobox input:focus-visible { outline:2px solid #fff; outline-offset:1px; }
  #file { display:grid; gap:4px; padding:8px; border-radius:10px; background:rgba(29,30,33,.88); border:1px solid rgba(255,255,255,.12);
          box-shadow:0 6px 24px rgba(0,0,0,.35); }
  #file button { padding:7px 10px; border:1px solid rgba(255,255,255,.18); border-radius:7px; background:#2b2c30; color:#eee; cursor:pointer;
          font:600 12px/1.2 system-ui, sans-serif; }
  #file button:hover { border-color:#e8590c; }
  #file button:focus-visible { outline:2px solid #fff; outline-offset:1px; }
  #status { max-width:15em; font:11px/1.35 system-ui, sans-serif; color:#9a9ca3; }
  body.drop::after { content:'Drop to open'; position:fixed; inset:10px; display:grid; place-items:center; border:2px dashed #e8590c;
          border-radius:14px; background:rgba(232,89,12,.08); color:#fff; font:600 18px system-ui, sans-serif; pointer-events:none; }
  #menu { display:grid; gap:6px;
          padding:10px 12px; border-radius:12px; background:rgba(29,30,33,.88); border:1px solid rgba(255,255,255,.12);
          box-shadow:0 6px 24px rgba(0,0,0,.35); backdrop-filter:blur(6px); font:13px/1.2 system-ui, sans-serif; color:#c9ccd3; }
  #menu .mtitle { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:#9a9ca3; }
  #menu .mrow { display:flex; align-items:center; gap:8px; cursor:text; }
  #menu .mrow span { width:1.2em; font-weight:700; color:#eee; }
  #menu .mrow input { width:6ch; padding:4px 7px; border-radius:7px; border:1px solid rgba(255,255,255,.18);
          background:#2b2c30; color:#fff; font:600 14px/1.2 system-ui, sans-serif; font-variant-numeric:tabular-nums; outline:0; }
  #menu .mrow input:focus { border-color:#e8590c; box-shadow:0 0 0 3px rgba(232,89,12,.3); }
  #menu .mrow small { font-size:11px; color:#9a9ca3; }
  #name { position:fixed; left:0; top:0; transform:translate(-50%,-100%); pointer-events:none; white-space:nowrap;
          padding:4px 12px; border-radius:9px; background:rgba(29,30,33,.9); border:1px solid rgba(255,255,255,.22);
          color:#fff; font:700 16px/1.3 system-ui, sans-serif; letter-spacing:.02em; box-shadow:0 4px 16px rgba(0,0,0,.35); }
  #hud { position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom, 0px)); color:var(--muted); pointer-events:none; font-variant-numeric:tabular-nums; }
  #hud b { color:var(--fg); font-weight:600; }
  /* Brick Properties: the top-right counterpart of #side. Narrower on phones so it leaves room
     for the size menu; scrolls on its own if the colour editor makes it taller than the screen. */
  #props { position:fixed; z-index:1; right:calc(12px + env(safe-area-inset-right, 0px)); top:calc(12px + env(safe-area-inset-top, 0px));
          box-sizing:border-box; width:240px; max-width:calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));

<script>
// --- Brick shapes: rounds / cones (B_*) and Ramp Crest / Crest End (PB_*). A verbatim copy of
// prototypes/shapes.js (keep the two in sync), inlined so this file stays self-contained. Defines
// window.BrickShapes; used by shapeBuffer() and the loader in the script below.
// Brickadia brick shapes the viewer doesn't draw yet: rounds / cones (fixed B_* meshes), Ramp Crest
// and Ramp Crest End (procedural PB_* meshes). Framework-agnostic: pure functions that return typed
// arrays, no WebGL calls, so the code can be pasted into save-viewer.html later.
//
// Approximations only, from the user's specs, screenshots and saves (no game files were extracted).
// Every guess sits behind a named constant below; the open ones are listed in OPEN_QUESTIONS.
//
// --- Convention (same as rampBuffer in save-viewer.html) ---
// * Positions are in the UNIT BOX (-0.5..0.5 on every axis), GL axes: x = world X, y = world Z (up),
//   z = world Y. The viewer scales them with uScale = the brick's world size and moves them with
//   uCenter, so vL / uHalf / bevel maths work unchanged.
// * Normals are the REAL world normals (computed from the real proportions, not the unit box), because
//   the viewer's shader does not rescale normals.
// * Meshes are NON-INDEXED triangle lists, wound counter-clockwise seen from outside (the viewer
//   doesn't cull, but this keeps culling possible).
// * Viewer units: 1 stud = 0.2, 1 Brickadia unit = 0.02 (stud = 10 units, plate = 4, micro = 2).
//
// --- Mesh object returned by every generator ---
//   positions  Float32Array, 3 per vertex (unit box)
//   normals    Float32Array, 3 per vertex
//   flags      Float32Array, 1 per vertex: the viewer's aSlope flag (1 = sloped ramp-style face:
//              no studs / underside / bevel, gets the slope bump texture)
//   parts      Float32Array, 1 per vertex: PART code, tells the shader which detail to draw (below)
//   caps       Float32Array, 4 per vertex: (u, v, R, n) on round caps and the ledge ring, zeros elsewhere:
//                u, v = position on the cap from the round's axis, in stud-pattern cells
//                       (u along world X, v along world Y = GL z)
//                R    = the cap's clip radius, same units
//                n    = top cap: stud cells across the pattern (1 for 1x1 and both cones, 2 for 2x2, 4 for 4x4);
//                       bottom cap: footprint + 1, so the underside grid's corners (sockets) land on the
//                       CENTRE of every stud cell: 2 for 1x1 (1 socket), 3 for 2x2 (4), 5 for 4x4 (16)
//              Stud cell coordinate:   c = fract(vec2(u, v) + n*0.5) - 0.5     (-0.5..0.5, like the viewer)
//              Underside coordinate:   q = vec2(u, v) + n*0.5, brick size sz = vec2(n)  (0..n, like the viewer),
//                but the rim follows the circle: e = R - length(vec2(u, v)), rim width ROUND_UNDER_RIM.
//   count      vertex count
//   size       world size [X, Y, Z] in viewer units (rounds only; the caller gives it for procedural shapes)
//   half       half-extents [X, Y, Z] in Brickadia units (rounds only: B_* bricks have no size in the save)
// interleave(mesh) packs them for one ARRAY_BUFFER (stride 28: pos3 nrm3 flag1, rampBuffer's layout), or
// interleave(mesh, true) for stride 48: pos3 nrm3 flag1 part1 cap4.
(function (root) {
'use strict';

// --- Units ---
const STUD = 0.2, UNIT = STUD / 10, MICRO = 2 * UNIT, PLATE = 4 * UNIT;

// --- Part codes (the per-vertex `parts` attribute) ---
const PART = {
  PLAIN: 0,        // a box-like face: the viewer's existing logic (studs on top, underside below, box bevel)
  ROUND_TOP: 1,    // round / cone top cap: stud pattern from `caps`, clipped by the cap's circle
  ROUND_BOTTOM: 2, // round bottom (stud cylinder's end + the ledge ring): underside pattern from `caps`
  ROUND_SIDE: 3,   // curved side (smooth normals): no studs, no underside
  SLOPE: 4,        // ramp-style sloped face (same faces as flags = 1)
  PLAIN_TOP: 5,    // a flat upward face that must NOT get studs (only the optional flat crest peak)
  ROUND_LEDGE: 6,  // the downward ring between the stud cylinder and the body: plain, radial bevel on its outer edge
};

// --- Rounds (assumptions are marked A1..; see OPEN_QUESTIONS) ---
const ROUND_SEGMENTS = 40;          // facets around a 1x1 round (smooth normals hide them)
const ROUND_SEGMENTS_2X2 = 48;      // facets around a 2x2 round
const ROUND_SEGMENTS_4X4 = 64;      // facets around a 4x4 round
const ROUND_STUD_DIAMETER = 0.78;   // bottom stud cylinder across, fraction of the footprint (rounds_shot6: ~199 px on 256 px/stud)
const ROUND_STUD_HEIGHT = MICRO;    // bottom stud cylinder height: 1 micro (user spec); NOT doubled on 2x2 (A2)
// Cone top diameter is per type (ROUND_TYPES[..].top, in studs): 0.6 on the 1x1 (rounds_shot6),
// 1.0 on the 2x2 (rounds2x2_shot9/10: top ~0.5 of the 2-stud base).
// The stud texture on the cone's top: 1.0 = the normal-size stud (flat top 0.5 stud) cut by the 0.6
// circle, as rounds_shot7.png shows (flat square ~213 px inside a ~302 px top on a ~430 px base).
// 0.6 would squeeze a whole stud pattern into the circle instead.
const CONE_TOP_STUD_SCALE = 1.0;
// Round bottoms (rounds_shot8 / rounds2x2_shot11): a round rim wall following the stud cylinder's
// circle, then the recess with one socket square per stud cell (at the cell's centre) and skeleton
// lines through the sockets (the viewer's underside pattern shifted half a cell). Wall width in
// studs, ~36 px against a ~465 px (0.78 stud) cylinder on the 1x1.
const ROUND_UNDER_RIM = 0.06;
// n = footprint in studs, h = full height in Brickadia units, top = cone top diameter in studs.
// Round tops show an n x n stud grid clipped by the circle (rounds2x2_shot10); cone tops show a
// single stud cell clipped by their small circle.
const ROUND_TYPES = {
  B_1x1F_Round: { n: 1, h: 4,  cone: false },             // half (5,5,2) in rounds-and-cone.brz; rounds_shot6/7/8
  B_1x1_Round:  { n: 1, h: 12, cone: false },             // half (5,5,6)
  B_1x1_Cone:   { n: 1, h: 12, cone: true, top: 0.6 },    // half (5,5,6)
  B_2x2F_Round: { n: 2, h: 4,  cone: false },             // rounds2x2_shot9/10/11: plate height, 2x2 studs
  B_2x2_Round:  { n: 2, h: 12, cone: false },             // brick height, 2x2 studs
  B_2x2_Cone:   { n: 2, h: 24, cone: true, top: 1.0 },    // ~2 bricks tall (shot9: 220 px tall on a 181 px / 2-stud base = 24.3 units), half (10,10,12)
  B_4x4_Round:  { n: 4, h: 12, cone: false },             // brick height, 4x4 studs (shot9/10)
};

// --- Ramp Crest / Crest End ---
const CREST_LIP = MICRO;            // A5: vertical lip at the crest's low edges: 1 micro, like the regular ramp
const CREST_PEAK_FLAT = 0;          // A6: width of a flat strip at the peak (viewer units); 0 = sharp ridge
// A7: Crest End's end face. 'match' = same pitch as the side slopes (a true hip roof: the ridge carries
// on when the brick is wider than half its run); 'width' = the end face always rises across the whole
// width to an apex at the open end. Identical for every size seen so far (width 1 stud, run 2 studs).
const CREST_END_PITCH = 'match';

const OPEN_QUESTIONS = [
  'A2: the 2x2 / 4x4 bottom stud cylinder is 0.78 x footprint across (1.56 / 3.12 studs) and still 1 micro tall; the 2x2 cone has one too (not visible in the shots).',
  'A4c: the round rim wall under 2x2 / 4x4 rounds keeps the 1x1 width (0.06 stud).',
  'A4d: B_2x2_Cone is 24 units tall (measured 24.3 from rounds2x2_shot9) with a 1.0-stud top; its half would be (10,10,12). Saves give no size for B_* bricks, so this is a constant.',
  'A5: Ramp Crest / Crest End have a 1-micro vertical lip on every low edge (like the ramp).',
  'A6: the crest peak is a sharp ridge (CREST_PEAK_FLAT = 0), as it looks in ramp-crests_a/b.webp.',
  'A7: Crest End end face uses the side slopes\' pitch (hip roof) when the brick is wider than half its run.',
  'A8: Crest End orientation: closed end at world -Y / +X / +Y / -X for rotations 0 / 1 / 2 / 3. Rotations 1 and 3 read off ramp-crest-end.webp; 0 and 2 inferred.',
  'A9: the bottom of crests / crest ends gets the normal brick underside texture (unverified, like the ramp).',
];

// --- Builder: collects triangles in real (viewer-unit) coordinates around the box centre ---
function Builder(up) { this.up = up < 0 ? -1 : 1; this.p = []; this.n = []; this.f = []; this.k = []; this.c = []; }
const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };
const ZERO4 = [0, 0, 0, 0];
// one triangle; ns = one normal or three; cs = one cap tuple or three. Winding is fixed so the
// triangle faces along its (average) normal.
Builder.prototype.tri = function (a, b, c, ns, flag, part, cs) {
  const n3 = Array.isArray(ns[0]) ? ns : [ns, ns, ns];
  const c3 = cs ? (Array.isArray(cs[0]) ? cs : [cs, cs, cs]) : [ZERO4, ZERO4, ZERO4];
  const avg = [n3[0][0]+n3[1][0]+n3[2][0], n3[0][1]+n3[1][1]+n3[2][1], n3[0][2]+n3[1][2]+n3[2][2]];
  let order = [0, 1, 2];
  const fn = cross(sub(b, a), sub(c, a));
  if (Math.hypot(fn[0], fn[1], fn[2]) < 1e-12) return;   // degenerate
  if (dot(fn, avg) < 0) order = [0, 2, 1];
  if (this.up < 0) order = [order[0], order[2], order[1]];   // the vertical mirror flips the winding
  const v = [a, b, c];
  for (const i of order) {
    this.p.push(v[i][0], this.up*v[i][1], v[i][2]);
    this.n.push(n3[i][0], this.up*n3[i][1], n3[i][2]);
    this.f.push(flag); this.k.push(part); this.c.push(...c3[i]);
  }
};
// flat convex polygon (fan); the normal comes from the points, flipped to point away from `inside`
Builder.prototype.poly = function (pts, inside, flag, part) {
  let n = [0, 0, 0];
  for (let i = 1; i + 1 < pts.length; i++) { const t = cross(sub(pts[i], pts[0]), sub(pts[i+1], pts[0])); n = [n[0]+t[0], n[1]+t[1], n[2]+t[2]]; }
  n = norm(n);
  if (dot(n, sub(pts[0], inside)) < 0) n = [-n[0], -n[1], -n[2]];
  for (let i = 1; i + 1 < pts.length; i++) this.tri(pts[0], pts[i], pts[i+1], n, flag, part);
};
// real coords -> unit box, typed arrays
Builder.prototype.finish = function (size, extra) {
  const P = new Float32Array(this.p);
  for (let i = 0; i < P.length; i++) P[i] /= size[[0, 2, 1][i % 3]];   // GL x = X, y = Z, z = Y
  return Object.assign({
    positions: P, normals: new Float32Array(this.n), flags: new Float32Array(this.f),
    parts: new Float32Array(this.k), caps: new Float32Array(this.c), count: this.f.length,
  }, extra || {});
};

// --- Rounds ---
// name: one of ROUND_TYPES; up: +1 upright, -1 upside down. Returns the mesh plus `size` (world
// [X,Y,Z] in viewer units, for uScale) and `half` (Brickadia half-extents, for placing the brick).
// Bottom to top: stud cylinder (ROUND_STUD_DIAMETER, 1 micro), the downward ledge ring, the body
// (cylinder, or a frustum for cones), the top cap.
function roundMesh(name, up = 1) {
  const T = ROUND_TYPES[name];
  if (!T) throw new Error('unknown round ' + name);
  const N = T.n, H = T.h * UNIT, seg = N > 2 ? ROUND_SEGMENTS_4X4 : N > 1 ? ROUND_SEGMENTS_2X2 : ROUND_SEGMENTS;
  const rb = 0.5 * N * STUD;                                  // body radius at the bottom
  const rt = T.cone ? 0.5 * T.top * STUD : rb;                // body radius at the top
  const rs = rb * ROUND_STUD_DIAMETER;                        // stud cylinder radius
  const hs = Math.min(ROUND_STUD_HEIGHT, H * 0.5);
  const y0 = -H / 2, y1 = y0 + hs, y2 = H / 2;

<script>

<script>
// --- Editor: Bricks catalogue, placement ghost, copy / paste, delete ---------------------------

//
// Placement uses a GHOST: a group of brick templates (items), each with lo / hi relative to the group's
// low corner, so a multi-brick selection can reuse it later. Every frame the ghost is posed under the
// cursor (pose = the group's low corner, current frame), checked against the scene and drawn translucent,
// tinted red when the spot is taken. Placing turns the items into bricks in one undo step:
//   { kind:'list', label, adds:[[index, snap]], removes:[[index, snap]], selBefore, selAfter }

// Tiny isometric glyphs (22 x 20) for the catalogue; x, y in 0..1 (footprint), z in 0..1 (a brick's height)
function iconSvg([kind, h = 1, extra]){
  const P = (x, y, z) => `${(11 + (x - y)*8).toFixed(1)},${(12 + (x + y)*4 - z*9).toFixed(1)}`;
  const poly = (pts, a) => `<polygon points="${pts.map(p => P(...p)).join(' ')}" fill="currentColor" fill-opacity="${a}"/>`;
  const m = .15;                              // ramp lip height
  let s = '';
  if (kind === 'box') {
    s = poly([[1,0,0],[1,1,0],[1,1,h],[1,0,h]], .3) + poly([[0,1,0],[1,1,0],[1,1,h],[0,1,h]], .18) + poly([[0,0,h],[1,0,h],[1,1,h],[0,1,h]], .55);
    if (extra === true) s += `<ellipse cx="11" cy="${(15 - 9*h).toFixed(1)}" rx="3.2" ry="1.6" fill="currentColor" fill-opacity=".9"/>`;   // studs
  } else if (kind === 'ramp') {
    s = poly([[1,0,0],[1,1,0],[1,1,m],[1,0,m]], .3) + poly([[0,1,0],[1,1,0],[1,1,m],[0,1,1]], .18) + poly([[0,0,1],[1,0,m],[1,1,m],[0,1,1]], .55);
  } else if (kind === 'crest') {
    s = poly([[0,0,m],[.5,0,1],[.5,1,1],[0,1,m]], .4) + poly([[.5,0,1],[1,0,m],[1,1,m],[.5,1,1]], .55) +
        poly([[1,0,0],[1,1,0],[1,1,m],[1,0,m]], .3) + poly([[0,1,0],[1,1,0],[1,1,m],[.5,1,1],[0,1,m]], .18);
  } else if (kind === 'crestEnd') {
    s = poly([[0,0,m],[.5,.5,1],[.5,1,1],[0,1,m]], .4) + poly([[1,0,m],[.5,.5,1],[.5,1,1],[1,1,m]], .55) +
        poly([[1,0,0],[1,1,0],[1,1,m],[1,0,m]], .3) + poly([[0,1,0],[1,1,0],[1,1,m],[.5,1,1],[0,1,m]], .18);
  } else {                                    // round / cone; extra = footprint in studs
    const r = 4 + 4*Math.sqrt(Math.min(1, (extra || 1)/4)), yb = 16, yt = 16 - 9*Math.min(1, h), rt = kind === 'cone' ? r*.45 : r;
    s = `<path d="M${11-r},${yb} A${r},${r/2} 0 0 0 ${11+r},${yb} L${11+rt},${yt} L${11-rt},${yt} Z" fill="currentColor" fill-opacity=".3"/>` +
        `<ellipse cx="11" cy="${yt}" rx="${rt}" ry="${rt/2}" fill="currentColor" fill-opacity=".6"/>`;
  }
  return `<svg viewBox="0 0 22 20" aria-hidden="true" stroke="currentColor" stroke-opacity=".75" stroke-width=".8" stroke-linejoin="round">${s}</svg>`;
}

// --- Ghost state

// a quarter turn of each item's shape fields, +X toward +Y (the orientation byte's rotation + 1, see rampDir)
const ROTATE = {

  crest: t => { t.run = 1 - (t.run | 0); },

      if (ROTATE[t.shape]) ROTATE[t.shape](t);

    for (const t of items) for (const i of [0, 1]) { t.lo[i] = r3(t.lo[i] - m[i]); t.hi[i] = r3(t.hi[i] - m[i]); }

function rotateGhost(turns){ if (!G) return; rotateItems(G.items, turns); playClick(); }

// --- Posing: a ray from the cursor (the same one pickRay casts), onto the face under it, else the ground
function cursorRay(mx, my){

// the scene's ground: the lowest brick bottom (as the ground grid uses), remembered for an empty scene
function groundZ(){

function poseGhost(){

  if (hit && hit.ax >= 0 && bricks[hit.k]) {

    const own = hit.k === sel, bl = own ? dlo : bricks[hit.k].lo, bh = own ? dhi : bricks[hit.k].hi;
    const P = r.S.map((v, i) => v + r.D[i]*hit.s), a = hit.ax, outward = r.D[a] > 0 ? -1 : 1;
    for (let i = 0; i < 3; i++) p[i] = i === a ? (outward > 0 ? bh[i] : r3(bl[i] - sz[i])) : snap(P[i] - sz[i]/2, bl[i], st[i]);

    if (Math.abs(r.D[2]) < 1e-9) return;

    if (t < 0) return;
    const P = r.S.map((v, i) => v + r.D[i]*t);

// does any item at pose p overlap a brick (touching is fine)? The focused brick is tested live, the

function ghostHits(p){

  const L = [0, 0, 0], H = [0, 0, 0];
  for (const t of G.items) {
    const l = [0, 1, 2].map(i => p[i] + t.lo[i]), h = [0, 1, 2].map(i => p[i] + t.hi[i]);
    if (bricks[sel] && over(l, h, dlo, dhi)) return true;
    const la = l.map((v, i) => v + histOrigin[i]), ha = h.map((v, i) => v + histOrigin[i]);

// --- Drawing (called at the end of frame(), after the resize ghost): a depth-only pass, then the brick
// itself blended at a constant alpha (no shader change), a red wash when blocked, and the box outline
// on top of everything.
window.editorDraw = () => {
  if (!G) return;
  poseGhost();
  if (!G.pose) return;
  const p = G.pose;
  const boxes = G.items.map(t => [[0, 1, 2].map(i => p[i] + t.lo[i]), [0, 1, 2].map(i => p[i] + t.hi[i])]);
  const body = (t, [l, h]) => {
    setBrick(t, l, h);
    if (t.shape) {                               // ramp / crest / crest end / round: its real mesh
      const m = shapeBuffer(t, [h[0]-l[0], h[1]-l[1], h[2]-l[2]]);
      meshAttribs(m, true);
      gl.drawArrays(gl.TRIANGLES, 0, shapeCount(m));
      meshAttribs(vb, false);

  gl.colorMask(false, false, false, false); gl.depthMask(true); gl.depthFunc(gl.LESS);

// --- Scene edits: one 'list' transaction each

// focus brick k (clamped), keeping the on-screen zoom; an empty scene keeps a detached box
function focusKeepZoom(k, keep = cam.half){

    if (!ok) b.setAttribute('aria-disabled', 'true');
    b.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      ev.preventDefault();                       // no focus / text selection: keys keep going to the scene
      if (!ok) { setStatus(`${e.label}: coming soon`); return; }
      startPlacing(entryItems(e), `place ${e.label.toLowerCase()}`, 'drag', b);
    });
    b.addEventListener('click', ev => { if (ev.detail === 0 && ok) startPlacing(entryItems(e), `place ${e.label.toLowerCase()}`, 'click', b); });   // keyboard
    grid.append(b);
  }
}
renderCatalogue();

// --- Input. Capture-phase listeners on window, so a ghost gets the canvas clicks / wheel before the
// resize / focus / zoom handlers (which stay untouched).
addEventListener('pointermove', e => {
  lastMouse = [e.clientX, e.clientY]; lastOver = e.target === canvas;
  if (!G) return;
  G.mouse = lastMouse; G.over = lastOver; if (lastOver) G.visited = true;
  if (G.mode === 'drag' && !(e.buttons & 1)) endPlacing('Placement cancelled');   // released outside the window
}, true);
addEventListener('pointerdown', e => {
  if (!G || e.target !== canvas || e.button === 1) return;     // the middle button still orbits
  e.stopImmediatePropagation(); e.preventDefault();
  if (e.button === 2) { endPlacing('Placement cancelled'); return; }
  if (e.button === 0 && G.mode === 'click' && placeGhost()) endPlacing();
}, true);
addEventListener('pointerup', e => {
  if (!G || G.mode !== 'drag' || e.button !== 0) return;
  G.mouse = [e.clientX, e.clientY]; G.over = e.target === canvas;
  if (G.over) { placeGhost(); endPlacing(); return; }           // refused: placeGhost said why
  const onItem = e.target.closest && e.target.closest('.bitem') === G.from;
  if (!G.visited && onItem) { G.mode = 'click'; setStatus(`Placing ${ghostName(G.items)}: click in the scene to place, Esc cancels`); return; }
  endPlacing('Placement cancelled');
}, true);
addEventListener('dblclick', e => { if (G || performance.now() - lastPlaceT < 600) e.stopImmediatePropagation(); }, true);   // no size reset
let wheelAcc = 0;
addEventListener('wheel', e => {
  if (!G || !(e.ctrlKey || e.shiftKey || e.metaKey)) return;
  e.preventDefault(); e.stopImmediatePropagation();
  const px = (e.deltaY || e.deltaX) * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? innerHeight : 1);   // Shift+wheel often arrives as deltaX
  let d = 0;
  if (Math.abs(px) >= 60) { wheelAcc = 0; d = Math.sign(px); }
  else { wheelAcc += px; if (Math.abs(wheelAcc) >= 60) { d = Math.sign(wheelAcc); wheelAcc = 0; } }
  if (!d) return;
  if (e.shiftKey) nudgeGhost(-d);               // wheel up = raise
  else rotateGhost(d < 0 ? 1 : -1);
}, { capture: true, passive: false });
addEventListener('keydown', e => {
  if (isTyping(e.target)) return;
  const k = e.key, ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && !e.altKey && !e.shiftKey && (k === 'c' || k === 'C')) { if (!held) copyFocused(); return; }
  if (ctrl && !e.altKey && !e.shiftKey && (k === 'v' || k === 'V')) { if (pasteMode === 'brick' && clip && !held) { e.preventDefault(); startPaste(); } return; }
  if (ctrl || e.altKey) return;
  if (G) {
    if (k === 'Escape') { e.preventDefault(); endPlacing('Placement cancelled'); }
    else if (k === 'r' || k === 'R') { e.preventDefault(); rotateGhost(e.shiftKey ? -1 : 1); }
    else if (k === 'PageUp' || k === 'PageDown') { e.preventDefault(); nudgeGhost(k === 'PageUp' ? 1 : -1); }
    return;
  }
  if (k === 'Delete') { e.preventDefault(); deleteFocused(); }
});
addEventListener('blur', () => { if (G && G.mode === 'drag') endPlacing(); });
// for debugging / tests from the console
window.editor = { get ghost(){ return G; }, get clip(){ return clip; }, get pasteMode(){ return pasteMode; }, CATALOGUE, startPlacing, placeGhost, deleteFocused, copyFocused, rotateItems };
})();
</script>

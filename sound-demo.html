<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sound Demo</title>
    <style>
      :root { color-scheme: dark; --bg: #16181d; --card: #22252c; --fg: #e8e8ea; --muted: #9aa0aa; --accent: #e8590c; }
      body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
      main { max-width: 560px; margin: 0 auto; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { color: var(--muted); margin: 0 0 16px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 16px; }
      button { background: var(--card); color: var(--fg); border: 1px solid #333842; border-radius: 10px; padding: 12px; font: inherit; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
      input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>UI sounds (dev demo)</h1>
      <p>All synthesised with Web Audio; nothing plays until your first click or key press.</p>
      <div class="grid" id="sounds"></div>
      <div class="row"><label for="step">Resize step</label><input id="step" type="range" min="1" max="48" value="1" /><span id="stepv">1</span></div>
      <div class="row"><button id="sweep" type="button">Resize sweep 1-24</button></div>
      <div class="row"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.05" /><span id="volv"></span></div>
      <div class="row"><label><input id="mute" type="checkbox" /> Mute</label></div>
    </main>
    <script type="module" src="/src/dev/sound-demo.ts"></script>
  </body>
</html>
